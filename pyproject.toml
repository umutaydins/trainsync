[project]
name = "trainsync"
version = "0.1.0"
description = "Self-hosted backend that keeps an always-fresh copy of Strava training data in PostgreSQL and serves it through a typed HTTP API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by task P1.1 (see docs/tasks/). Keep this list sorted.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainsync"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S603", "S607"]
"fake_strava/**" = ["S311"]
"loadtest/**" = ["S311"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (testcontainers Postgres/Redis and/or fake_strava)",
    "fault: fault-injection scenarios (429/5xx bursts, timeouts, restarts)",
]
