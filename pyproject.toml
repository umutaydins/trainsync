[project]
name = "trainsync"
version = "0.1.0"
description = "Self-hosted backend that keeps an always-fresh copy of Strava training data in PostgreSQL and serves it through a typed HTTP API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by task P1.1 (see docs/tasks/). Keep this list sorted.
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "anyio>=4",
    "argon2-cffi>=23.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.23.1",
    "ruff>=0.6",
    "testcontainers[postgres,redis]>=4.13.3",
    "types-pyyaml>=6.0.12",
]
loadtest = [
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainsync"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S603", "S607"]
"fake_strava/**" = ["S311"]
"loadtest/**" = ["S311"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "fake_strava"]
warn_unreachable = true
pretty = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (testcontainers Postgres/Redis and/or fake_strava)",
    "fault: fault-injection scenarios (429/5xx bursts, timeouts, restarts)",
]

# ---------------------------------------------------------------- import-linter (ADR 0033)
[tool.importlinter]
root_package = "trainsync"

[[tool.importlinter.contracts]]
name = "Layers: entrypoints -> modules -> integrations -> core"
type = "layers"
layers = [
    "trainsync.entrypoints",
    "trainsync.modules",
    "trainsync.integrations",
    "trainsync.core",
]

[[tool.importlinter.contracts]]
name = "Entrypoints are independent composition roots"
type = "independence"
modules = [
    "trainsync.entrypoints.api",
    "trainsync.entrypoints.bot",
    "trainsync.entrypoints.worker",
    "trainsync.entrypoints.demo",
    "trainsync.entrypoints.cli",
]

[[tool.importlinter.contracts]]
name = "Modules depend downward; tables (models.py) are shared"
type = "layers"
layers = [
    "trainsync.modules.notifications",
    "trainsync.modules.chat",
    # Statistics read check-ins, nutrition rules and each user's settings (ADR 0038).
    "trainsync.modules.stats",
    "trainsync.modules.admin | trainsync.modules.users",
    "trainsync.modules.coach | trainsync.modules.checkin | trainsync.modules.nutrition | trainsync.modules.sync",
    "trainsync.modules.training",
    "trainsync.modules.activities",
    "trainsync.modules.strava",
    "trainsync.modules.auth",
]
ignore_imports = ["trainsync.modules.** -> trainsync.modules.*.models"]

[[tool.importlinter.contracts]]
name = "ops is standard library only (it runs in the backup image)"
type = "forbidden"
source_modules = ["trainsync.ops"]
forbidden_modules = [
    "trainsync.core",
    "trainsync.integrations",
    "trainsync.modules",
    "trainsync.entrypoints",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["trainsync"]
# SQLAlchemy's asyncio layer runs on greenlets: without this, lines after an `await` on the
# database are not traced.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
