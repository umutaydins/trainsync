# Copy to config/messages.local.yaml (git-ignored) and add your own lines. They are merged into
# the savage packs (BOT_INTENSITY=savage, BOT_TONE=hardcore) and sent verbatim (ADR 0030, 0031,
# 0032). One section per chat language (tr:, en:) with the categories of
# src/trainsync/coach/savage_tr.py / savage_en.py; any category or section may be left out.
# punchline_en at the top level is appended in both languages. A `max:` section inside a language
# holds lines for profanity `max` (/swear max), including `max_opener` (put in front of every
# other savage message); punchline_en_max at the top level goes into both max pools. A line that
# breaks a guardrail (body/weight/appearance, slurs, calorie punishment or restriction) is
# dropped at startup and logged as `coach_local_line_dropped`. Profanity is fine.
tr:
  excuse:
    - "Bahaneni duydum. Şimdi ayakkabını giy."
  missed_workout:
    - "Bugün yoktun. Yarın iki kere hatırlatacağım."
  under_target:
    - "Eksik kaldı. Sıradaki seti tam yap."
  workout_start:
    - "Başladık. Sadece işini yap."
  rest_over:
    - "Mola bitti, kalk."
  workout_done_good:
    - "Temiz iş."
  workout_done_bad:
    - "Yarım kaldı. Bir dahakine bitir."
  reminder_before:
    - "Yarım saat var. Hazırlan."
  reminder_now:
    - "Saat geldi."
  escalation:
    - "Hâlâ bekliyorum."
  language_set:
    - "Türkçe. Hadi bakalım."
  food_roast:
    - "Bu seçim plana uymuyor. Değiştir."
  profanity_set:
    - "Tamam, küfür fırçada kalsın."
  unknown_command:
    - "Öyle bir komut yok."
  max:
    excuse:
      - "Bundan sonra her mesajda küfür var lan."
    max_opener:
      - "Lan, dinle:"
en:
  excuse:
    - "Heard the excuse. Now put your shoes on."
  rest_over:
    - "Break's over, move."
  language_set:
    - "English. Let's go."
  max:
    max_opener:
      - "Okay, fucking listen:"
punchline_en:
  - "Do it anyway."
punchline_en_max:
  - "Do it anyway, damn it."
