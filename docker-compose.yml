# Local stack. Every secret is `${VAR:-dev-only default}`: the default after `:-` is a DEV-ONLY
# dummy value, never use it anywhere else. Set your own in `.env` (or the shell) to override it;
# with ENV=prod the API, worker, bot and web log a warning while any dev default is still in use.
# The smoke, e2e and load-test scripts pass an empty env file, so they always run on these defaults.

x-trainsync-env: &trainsync-env
  ENV: prod
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://trainsync:trainsync@postgres:5432/trainsync
  REDIS_URL: redis://redis:6379/0
  STRAVA_API_BASE_URL: http://fake-strava:8001/api/v3
  STRAVA_OAUTH_BASE_URL: http://fake-strava:8001/oauth
  STRAVA_OAUTH_PUBLIC_BASE_URL: http://localhost:8001/oauth
  STRAVA_CLIENT_ID: "12345"
  STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-dev-only-client-secret}
  STRAVA_REDIRECT_URI: http://localhost:8000/auth/strava/callback
  STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN:-dev-only-verify-token}
  STRAVA_WEBHOOK_SUBSCRIPTION_ID: "1"
  # DEV-ONLY Fernet key: base64 of "dev-only-fernet-key-not-for-use!". Generate your own for real use.
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-ZGV2LW9ubHktZmVybmV0LWtleS1ub3QtZm9yLXVzZSE=}
  STATE_SIGNING_KEY: ${STATE_SIGNING_KEY:-dev-only-state-signing-key}
  # DEV-ONLY key; TRAINSYNC_API_KEY (web) must be one of these.
  API_KEYS: ${API_KEYS:-dev-key-1}

x-trainsync-image: &trainsync-image
  build: .
  image: trainsync:dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trainsync
      POSTGRES_PASSWORD: trainsync
      POSTGRES_DB: trainsync
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainsync -d trainsync"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-strava:
    <<: *trainsync-image
    command: ["uvicorn", "fake_strava.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      FAKE_STRAVA_SEED_ACTIVITIES: ${FAKE_STRAVA_SEED_ACTIVITIES:-300}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/_control/stats', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *trainsync-image
    command: ["alembic", "upgrade", "head"]
    environment: *trainsync-env
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *trainsync-image
    environment:
      <<: *trainsync-env
      # Where the OAuth callback may send the browser back to (the web dashboard's sync page).
      OAUTH_RETURN_TO_ALLOWLIST: http://localhost:3000/sync
      # Plate calculator and double progression (P6.3, ADR 0018).
      GYM_BAR_KG: ${GYM_BAR_KG:-20}
      GYM_PLATES: ${GYM_PLATES:-25x2,20x2,15x2,10x2,5x2,2.5x2,1.25x2}
      PROGRESSION_INCREMENT_KG: ${PROGRESSION_INCREMENT_KG:-2.5}
      PROGRESSION_LOWER_BODY_INCREMENT_KG: ${PROGRESSION_LOWER_BODY_INCREMENT_KG:-5}
      # Food lookups (P6.4, ADR 0019); `make web-e2e` sets false so the stack never reaches the internet.
      OPENFOODFACTS_ENABLED: ${OPENFOODFACTS_ENABLED:-true}
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fake-strava: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *trainsync-image
    command: ["arq", "trainsync.worker.WorkerSettings"]
    environment:
      <<: *trainsync-env
      HEALTHCHECK_URL: http://127.0.0.1:9100/metrics
      # New-activity notifications (P5.6); without a token the worker uses the NullNotifier.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_NOTIFY_CHAT_ID: ${TELEGRAM_NOTIFY_CHAT_ID:-}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:3000}
      BOT_TONE: ${BOT_TONE:-neutral}  # notification wording (ADR 0016)
      BOT_LANG: ${BOT_LANG:-en}
      BOT_INTENSITY: ${BOT_INTENSITY:-normal}  # coach (P6.11, ADR 0030)
      BOT_PROFANITY: ${BOT_PROFANITY:-roast}  # /swear default (P6.13, ADR 0032)
      SUGAR_LIMIT_G: ${SUGAR_LIMIT_G:-50}
      HIGH_SUGAR_PER_100G: ${HIGH_SUGAR_PER_100G:-22.5}
      EMERGENCY_NUMBER: ${EMERGENCY_NUMBER:-112}
      WORKOUT_REMINDER_TIME: ${WORKOUT_REMINDER_TIME:-18:00}
      QUIET_HOURS: ${QUIET_HOURS:-23:00-07:00}
      # Daily check-in prompt (P6.9, ADR 0020); empty CHECKIN_ENABLED = on with a bot token.
      CHECKIN_ENABLED: ${CHECKIN_ENABLED:-}
      CHECKIN_TIME: ${CHECKIN_TIME:-21:00}
      CHECKIN_TZ: ${CHECKIN_TZ:-Europe/Istanbul}
      CHECKIN_REMINDER_MINUTES: ${CHECKIN_REMINDER_MINUTES:-90}
    ports: ["9100:9100"]  # worker /metrics (WORKER_METRICS_PORT)
    volumes: ["./config:/app/config:ro"]  # own coach lines (optional, P6.11)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fake-strava: { condition: service_healthy }

  # Telegram bot (P5.5). Without TELEGRAM_BOT_TOKEN it does not poll: it only serves its metrics
  # and stays up, so the stack (and `make compose-smoke`) behaves the same with or without a token.
  bot:
    <<: *trainsync-image
    command: ["python", "-m", "trainsync.bot"]
    environment:
      <<: *trainsync-env
      HEALTHCHECK_URL: http://127.0.0.1:9101/metrics
      BOT_API_BASE_URL: http://api:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # empty = no natural-language questions
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5-5}
      BOT_TONE: ${BOT_TONE:-neutral}  # reply wording and assistant persona (ADR 0016)
      BOT_LANG: ${BOT_LANG:-en}
      BOT_INTENSITY: ${BOT_INTENSITY:-normal}  # coach (P6.11, ADR 0030)
      BOT_PROFANITY: ${BOT_PROFANITY:-roast}  # /swear default (P6.13, ADR 0032)
      SUGAR_LIMIT_G: ${SUGAR_LIMIT_G:-50}
      HIGH_SUGAR_PER_100G: ${HIGH_SUGAR_PER_100G:-22.5}
      EMERGENCY_NUMBER: ${EMERGENCY_NUMBER:-112}
      WORKOUT_REMINDER_TIME: ${WORKOUT_REMINDER_TIME:-18:00}
      QUIET_HOURS: ${QUIET_HOURS:-23:00-07:00}
      # The bot's "today" (P6.8) and the check-in conversation (P6.9).
      CHECKIN_ENABLED: ${CHECKIN_ENABLED:-}
      CHECKIN_TIME: ${CHECKIN_TIME:-21:00}
      CHECKIN_TZ: ${CHECKIN_TZ:-Europe/Istanbul}
      CHECKIN_REMINDER_MINUTES: ${CHECKIN_REMINDER_MINUTES:-90}
    ports: ["9101:9101"]  # bot /metrics (BOT_METRICS_PORT)
    volumes: ["./config:/app/config:ro"]  # own coach lines (optional, P6.11)
    depends_on:
      api: { condition: service_healthy }

  # Web dashboard (web/). The defaults are DEV-ONLY dummy values (see the top of this file).
  web:
    build: ./web
    image: trainsync-web:dev
    environment:
      TRAINSYNC_API_URL: http://api:8000
      TRAINSYNC_API_KEY: ${TRAINSYNC_API_KEY:-dev-key-1}
      TRAINSYNC_PUBLIC_API_URL: http://localhost:8000
      WEB_PUBLIC_URL: http://localhost:3000
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-dev-only-dashboard-password}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-dev-only-dashboard-session-secret-not-for-real-use}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
